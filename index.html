<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Span Plan</title>
  
  <meta name="theme-color" content="#0d0d0f" id="themeMetaColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plan">

  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

  <div class="desktop-shell">
    <!-- HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">P</div>
        <span class="brand-name">Span</span>
        <span class="brand-app" id="headerTitle">Plan</span>
      </div>
      
      <div class="header-actions">
        <button class="icon-btn" onclick="openSettingsModal()" title="Paramètres">⚙️</button>
        <button class="plan-bridge-btn" onclick="goToFocusApp()">Focus ↗</button>
      </div>
    </header>

    <!-- SAISIE RAPIDE D'UNE TÂCHE -->
    <div class="quick-add-bar">
      <input type="text" class="task-input" id="planTaskInput" placeholder="Planifier une tâche... (Entrée)" onkeydown="if(event.key==='Enter') addPlannedTask()">
      <select class="category-select" id="planTaskBucket">
        <option value="today">Aujourd'hui</option>
        <option value="tomorrow">Demain</option>
        <option value="later">Plus tard</option>
      </select>
      <select class="category-select" id="planTaskCategory">
        <option value="None">Sans label</option>
        <option value="Code" id="optCatCode">Code</option>
        <option value="Study" id="optCatStudy">Study</option>
        <option value="Write" id="optCatWrite">Write</option>
        <option value="Admin" id="optCatAdmin">Admin</option>
      </select>
      <button class="btn-add" onclick="addPlannedTask()">Ajouter</button>
    </div>

    <!-- WORKSPACE PRINCIPAL : VUE COLONNES (PLANNER) -->
    <main class="workspace-main">
      <div class="planner-viewport">
        <div class="planner-slider" id="plannerSlider">
          
          <!-- COLONNE 1 : AUJOURD'HUI -->
          <section class="bucket-column" id="bucket-today">
            <div class="bucket-header">
              <div class="bucket-title-wrap">
                <span class="bucket-dot today"></span>
                <span class="bucket-title">Aujourd'hui</span>
              </div>
              <span class="bucket-badge" id="count-today">0</span>
            </div>
            <ul class="task-list" id="list-today"></ul>
          </section>

          <!-- COLONNE 2 : DEMAIN -->
          <section class="bucket-column" id="bucket-tomorrow">
            <div class="bucket-header">
              <div class="bucket-title-wrap">
                <span class="bucket-dot tomorrow"></span>
                <span class="bucket-title">Demain</span>
              </div>
              <span class="bucket-badge" id="count-tomorrow">0</span>
            </div>
            <ul class="task-list" id="list-tomorrow"></ul>
          </section>

          <!-- COLONNE 3 : PLUS TARD / BACKLOG -->
          <section class="bucket-column" id="bucket-later">
            <div class="bucket-header">
              <div class="bucket-title-wrap">
                <span class="bucket-dot later"></span>
                <span class="bucket-title">Plus tard</span>
              </div>
              <span class="bucket-badge" id="count-later">0</span>
            </div>
            <ul class="task-list" id="list-later"></ul>
          </section>

        </div>
      </div>
    </main>
  </div>

  <!-- MODALE ÉDITION TÂCHE PLAN -->
  <div class="modal-overlay" id="editPlanModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>Modifier la tâche</span>
        <button class="modal-close" onclick="closePlanEditModal()">✕</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Titre</label>
        <input type="text" class="modal-input" id="editPlanTitle">

        <label class="modal-label">Créneau / Bucket</label>
        <div class="category-pills" id="modalBucketPills">
          <button type="button" class="cat-pill" data-bucket="today" onclick="selectEditBucket('today')">Aujourd'hui</button>
          <button type="button" class="cat-pill" data-bucket="tomorrow" onclick="selectEditBucket('tomorrow')">Demain</button>
          <button type="button" class="cat-pill" data-bucket="later" onclick="selectEditBucket('later')">Plus tard</button>
        </div>

        <label class="modal-label">Catégorie</label>
        <div class="category-pills" id="modalPlanCategoryPills">
          <button type="button" class="cat-pill" data-cat="Code" onclick="selectEditCategory('Code')">Code</button>
          <button type="button" class="cat-pill" data-cat="Study" onclick="selectEditCategory('Study')">Study</button>
          <button type="button" class="cat-pill" data-cat="Write" onclick="selectEditCategory('Write')">Write</button>
          <button type="button" class="cat-pill" data-cat="Admin" onclick="selectEditCategory('Admin')">Admin</button>
        </div>

        <label class="modal-label">Estimation (Pomodoros)</label>
        <div class="pomodoro-stepper">
          <button type="button" class="stepper-btn" onclick="stepPlanEstimate(-1)">−</button>
          <span id="editPlanEstimate">1</span>
          <button type="button" class="stepper-btn" onclick="stepPlanEstimate(1)">+</button>
          <span style="font-size: 13px; color: var(--text-muted); margin-left: 8px;">blocs (~<span id="editPlanEstMinutes">25</span> min)</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closePlanEditModal()">Annuler</button>
        <button class="btn-save" onclick="savePlanTaskModal()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- MODALE SETTINGS & SYNCHRO -->
  <div class="modal-overlay" id="settingsModalOverlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>Préférences Span Plan</span>
        <button class="modal-close" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <div>
            <div style="font-size: 14px; font-weight: 500;">Thème</div>
            <div style="font-size: 12px; color: var(--text-muted);">Mode sombre par défaut</div>
          </div>
          <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">Dark</button>
        </div>

        <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Liaison Span Suite (Supabase)</div>
        <div class="setting-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
          <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <div style="font-size: 13px; color: var(--text-muted);">
              Clé : <strong id="displaySyncKey" style="color: var(--text-main); font-family: monospace;">...</strong>
            </div>
            <button class="btn-theme-toggle" type="button" onclick="copyCurrentSyncKey()">Copier</button>
          </div>
          <div style="display: flex; gap: 6px; width: 100%;">
            <input type="text" id="inputSyncKey" placeholder="Coller la clé de Span Focus..." style="flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none;">
            <button class="btn-theme-toggle" type="button" onclick="handleLinkClick()">Lier</button>
          </div>
        </div>

        <div class="backup-section">
          <button class="btn-backup" onclick="exportPlanData()">Exporter JSON</button>
          <label class="btn-backup" style="cursor: pointer;">
            Importer JSON
            <input type="file" id="importFileInput" style="display: none;" onchange="importPlanData(event)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION MOBILE BAS D'ÉCRAN -->
  <nav class="nav-bar mobile-nav">
    <div class="nav-items">
      <button class="nav-btn active" id="nav-btn-today" onclick="switchBucketView(0)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Aujourd'hui</span>
      </button>
      <button class="nav-btn" id="nav-btn-tomorrow" onclick="switchBucketView(1)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Demain</span>
      </button>
      <button class="nav-btn" id="nav-btn-later" onclick="switchBucketView(2)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Plus tard</span>
      </button>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/sync.js?v=1.0"></script>
  <script src="js/plan.js?v=1.0"></script>
  <script src="js/app.js?v=1.0"></script>
</body>
</html>
