<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Span Plan</title>
  
  <meta name="theme-color" content="#0d0d0f" id="themeMetaColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plan">

  <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

  <div class="desktop-shell" id="appShell">
    
    <!-- TOP APP HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge">P</div>
        <span class="brand-name">Span</span>
        <span class="brand-app" id="headerTitle">Plan</span>
      </div>

      <!-- CATEGORY / CONTEXT SWITCHER (WORK - LIFE - FUN) -->
      <div class="context-switch" id="contextSwitch">
        <button class="context-btn active" data-context="all" onclick="setContextFilter('all')"><span>All</span></button>
        <button class="context-btn cat-work" data-context="work" onclick="setContextFilter('work')"><span>Work</span></button>
        <button class="context-btn cat-life" data-context="life" onclick="setContextFilter('life')"><span>Life</span></button>
        <button class="context-btn cat-fun" data-context="fun" onclick="setContextFilter('fun')"><span>Fun</span></button>
      </div>

      <div class="header-actions">
        <!-- BOUTON DE SECOURS RAPIDE -->
        <button class="icon-btn mini" onclick="recoverMissingTasks()" title="Rapatrier automatiquement les tâches perdues">🔄 Rapatrier</button>
        <button class="icon-btn" id="btnToggleDrawer" onclick="toggleBacklogDrawer()" title="Toggle Backlog (Later)">
          <span>Later</span>
          <span class="backlog-counter-pill" id="globalLaterCount">0</span>
        </button>
        <button class="icon-btn" onclick="openSettingsModal()" title="Settings">⚙️</button>
        <button class="plan-bridge-btn" onclick="goToFocusApp()" title="Open Span Focus">Focus ↗</button>
      </div>
    </header>

    <!-- TIMELINE CONTROLS -->
    <div class="timeline-bar">
      <div class="timeline-nav">
        <button class="nav-arrow-btn" onclick="navigateTimeline(-1)" title="Previous period">‹</button>
        <button class="today-jump-btn" onclick="jumpToToday()">Today</button>
        <button class="nav-arrow-btn" onclick="navigateTimeline(1)" title="Next period">›</button>
        <span class="current-range-label" id="currentRangeLabel">Loading...</span>
      </div>

      <div class="view-mode-controls">
        <div class="pill-group" id="daysSelectorGroup">
          <button class="pill-btn" data-days="1" onclick="setVisibleDays(1)">1D</button>
          <button class="pill-btn" data-days="2" onclick="setVisibleDays(2)">2D</button>
          <button class="pill-btn active" data-days="3" onclick="setVisibleDays(3)">3D</button>
          <button class="pill-btn" data-days="5" onclick="setVisibleDays(5)">5D</button>
          <button class="pill-btn" data-days="7" onclick="setVisibleDays(7)">7D</button>
        </div>
      </div>
    </div>

    <!-- QUICK ADD BAR -->
    <div class="quick-add-container">
      <input type="text" class="quick-input" id="quickTaskInput" 
             placeholder="Add task or event (e.g. 'Team standup 10:00' or simple 'Buy groceries')" 
             onkeydown="if(event.key==='Enter') submitQuickAdd()">
      
      <select class="quick-select" id="quickTargetDate">
        <option value="today">Today</option>
        <option value="tomorrow">Tomorrow</option>
        <option value="later">Later (Backlog)</option>
      </select>

      <select class="quick-select" id="quickContextSelect">
        <option value="work">Work</option>
        <option value="life">Life</option>
        <option value="fun">Fun</option>
      </select>

      <button class="btn-quick-add" onclick="submitQuickAdd()">Add</button>
    </div>

    <!-- MAIN WORKSPACE -->
    <main class="workspace-main">
      <div class="planner-board-container" id="plannerBoardContainer">
        <div class="planner-grid" id="plannerGrid">
          <!-- Rendered dynamically by plan.js -->
        </div>
      </div>

      <!-- RETRACTABLE BACKLOG DRAWER -->
      <aside class="backlog-drawer" id="backlogDrawer">
        <div class="drawer-header">
          <div class="drawer-title-wrap">
            <span class="drawer-title">Backlog / Later</span>
            <span class="backlog-counter-pill" id="drawerLaterCount">0</span>
          </div>
          <div class="drawer-actions">
            <button class="icon-btn mini" id="btnPinDrawer" onclick="togglePinDrawer()" title="Pin drawer">📌</button>
            <button class="icon-btn mini" onclick="toggleBacklogDrawer()" title="Close">✕</button>
          </div>
        </div>

        <div class="drawer-quick-add">
          <input type="text" id="backlogQuickInput" placeholder="Add unscheduled task..." onkeydown="if(event.key==='Enter') addBacklogTask()">
          <button class="btn-quick-add mini" onclick="addBacklogTask()">+</button>
        </div>

        <ul class="task-list drawer-list" id="backlogTaskList" ondragover="allowDrop(event)" ondrop="handleDropToBacklog(event)">
          <!-- Rendered dynamically -->
        </ul>
      </aside>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="nav-bar mobile-nav">
      <div class="nav-items">
        <button class="nav-btn" onclick="navigateTimeline(-1)">
          <span>‹ Prev</span>
        </button>
        <button class="nav-btn active" onclick="jumpToToday()">
          <span>Today</span>
        </button>
        <button class="nav-btn" onclick="navigateTimeline(1)">
          <span>Next ›</span>
        </button>
        <button class="nav-btn" onclick="toggleBacklogDrawer()">
          <span>Later (<span id="mobileLaterCount">0</span>)</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- CONTEXT MENU POPOVER FOR TASK (⋮) -->
  <div class="task-popover-menu" id="taskPopoverMenu" style="display: none;">
    <button type="button" class="popover-item" onclick="popoverAction('focus')">🎯 Focus in Spotlight</button>
    <button type="button" class="popover-item" onclick="popoverAction('backlog')">📥 Move to Later</button>
    <button type="button" class="popover-item danger" onclick="popoverAction('delete')">✕ Delete Task</button>
  </div>

  <!-- EDIT TASK MODAL -->
  <div class="modal-overlay" id="editModalOverlay" onclick="handleBackdropClick(event, 'editModalOverlay')">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>Edit Item</span>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Title</label>
        <input type="text" class="modal-input" id="editTaskTitle">

        <div class="form-row">
          <div class="form-col">
            <label class="modal-label">Date</label>
            <input type="date" class="modal-input" id="editTaskDate">
          </div>
          <div class="form-col">
            <label class="modal-label">Time (Leave empty if unscheduled)</label>
            <input type="time" class="modal-input" id="editTaskTime">
          </div>
        </div>

        <label class="modal-label">Context Category</label>
        <div class="category-pills" id="modalContextPills">
          <button type="button" class="cat-pill cat-work" data-context="work" onclick="selectEditContext('work')">Work</button>
          <button type="button" class="cat-pill cat-life" data-context="life" onclick="selectEditContext('life')">Life</button>
          <button type="button" class="cat-pill cat-fun" data-context="fun" onclick="selectEditContext('fun')">Fun</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-save" onclick="saveTaskModal()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModalOverlay" onclick="handleBackdropClick(event, 'settingsModalOverlay')">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>Span Plan Settings</span>
        <button class="modal-close" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <div>
            <div style="font-size: 14px; font-weight: 500;">Theme</div>
            <div style="font-size: 12px; color: var(--text-muted);">Dark mode by default</div>
          </div>
          <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">Dark</button>
        </div>

        <div style="margin-top: 14px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;">Multi-Device Sync (Supabase)</div>
        
        <form id="keychainSyncForm" onsubmit="event.preventDefault(); handleLinkClick();" autocomplete="on" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
          <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <div style="font-size: 13px; color: var(--text-muted);">
              Key: <strong id="displaySyncKey" style="color: var(--text-main); font-family: monospace;">...</strong>
            </div>
            <button class="btn-theme-toggle" type="button" onclick="copyCurrentSyncKey()">Copy</button>
          </div>
          
          <div style="display: flex; gap: 6px; width: 100%;">
            <input type="text" name="username" id="inputSyncKey" autocomplete="username" placeholder="Paste sync key from Span Focus..." style="flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none;">
            <input type="password" name="password" id="inputSyncSecret" autocomplete="current-password" style="display: none;">
            <button class="btn-theme-toggle" type="submit">Link</button>
          </div>
        </form>

        <div class="backup-section">
          <button class="btn-backup" onclick="exportData()">Download JSON</button>
          <label class="btn-backup" style="cursor: pointer;">
            Import JSON
            <input type="file" id="importFileInput" style="display: none;" onchange="importData(event)">
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/sync.js?v=4.0"></script>
  <script src="js/plan.js?v=4.0"></script>
  <script src="js/app.js?v=4.0"></script>
</body>
</html>
